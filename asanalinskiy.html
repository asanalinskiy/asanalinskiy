<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>asanalinskiy — Portfolio</title>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="загрузка.png"/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 12px 40px 0 rgba(99, 102, 241, 0.15);
    }
    .glow-bg {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
  <!-- Glowing spots -->
  <div class="glow-bg w-96 h-96 bg-indigo-600/20 -top-10 -left-10"></div>
  <div class="glow-bg w-96 h-96 bg-purple-600/15 top-1/2 -right-10"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const USERNAME = 'asanalinskiy';

    function App() {
      const [user, setUser] = React.useState(null);
      const [repos, setRepos] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [search, setSearch] = React.useState('');
      const [sortBy, setSortBy] = React.useState('updated');

      React.useEffect(() => {
        async function fetchData() {
          try {
            setLoading(true);
            const [userRes, reposRes] = await Promise.all([
              fetch(`https://api.github.com/users/${USERNAME}`),
              fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`)
            ]);

            if (!userRes.ok || !reposRes.ok) throw new Error('Не удалось загрузить данные с GitHub');

            const userData = await userRes.json();
            const reposData = await reposRes.json();

            setUser(userData);
            // Исключаем форки, если нужно показывать только свои проекты
            setRepos(reposData.filter(repo => !repo.fork));
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchData();
      }, []);

      const filteredRepos = React.useMemo(() => {
        return repos
          .filter(repo => 
            repo.name.toLowerCase().includes(search.toLowerCase()) ||
            (repo.description && repo.description.toLowerCase().includes(search.toLowerCase())) ||
            (repo.topics && repo.topics.some(t => t.toLowerCase().includes(search.toLowerCase())))
          )
          .sort((a, b) => {
            if (sortBy === 'stars') return b.stargazers_count - a.stargazers_count;
            if (sortBy === 'forks') return b.forks_count - a.forks_count;
            return new Date(b.updated_at) - new Date(a.updated_at);
          });
      }, [repos, search, sortBy]);

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-gray-400 font-medium animate-pulse">Загружаем проекты с GitHub...</p>
          </div>
        );
      }

      if (error) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen text-center px-4">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-5xl mb-4"></i>
            <h2 class="text-2xl font-bold mb-2">Ошибка загрузки</h2>
            <p class="text-gray-400 max-w-md">{error}</p>
          </div>
        );
      }

      return (
        <div class="max-w-6xl mx-auto px-4 py-12">
          {/* Profile Header */}
          <header class="glass-card rounded-3xl p-8 mb-10 transition-all duration-300">
            <div class="flex flex-col md:flex-row items-center gap-6">
              <img 
                src={user.avatar_url} 
                alt={user.name} 
                class="w-28 h-28 rounded-2xl border-2 border-indigo-500/30 shadow-lg"
              />
              <div class="flex-1 text-center md:text-left">
                <div class="flex flex-col md:flex-row md:items-center gap-3 mb-2">
                  <h1 class="text-3xl font-extrabold tracking-tight">{user.name || USERNAME}</h1>
                  <span class="text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full text-xs font-semibold self-center md:self-auto">
                    @{user.login}
                  </span>
                </div>
                <p class="text-gray-400 max-w-2xl mb-4 text-sm leading-relaxed">
                  {user.bio || 'Разработчик интерфейсов, веб-приложений и веб-экспериментов.'}
                </p>
                <div class="flex flex-wrap justify-center md:justify-start gap-4 text-xs font-medium text-gray-400">
                  <span class="flex items-center gap-1.5"><i class="fa-solid fa-folder-open text-indigo-400"></i> {user.public_repos} репозиториев</span>
                  <span class="flex items-center gap-1.5"><i class="fa-solid fa-users text-purple-400"></i> {user.followers} подписчиков</span>
                  {user.location && <span class="flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-rose-400"></i> {user.location}</span>}
                  <a href={user.html_url} target="_blank" class="flex items-center gap-1.5 text-indigo-400 hover:underline">
                    <i class="fa-brands fa-github"></i> GitHub Профиль
                  </a>
                </div>
              </div>
            </div>
          </header>

          {/* Controls Bar */}
          <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-8">
            <div class="relative w-full sm:w-80">
              <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
              <input 
                type="text" 
                placeholder="Поиск по проектам или тегам..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                class="w-full bg-slate-900/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors"
              />
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <span class="text-xs text-gray-400 font-medium">Сортировка:</span>
              <select 
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                class="bg-slate-900/80 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-500"
              >
                <option value="updated">По дате обновления</option>
                <option value="stars">По звёздам</option>
                <option value="forks">По форкам</option>
              </select>
            </div>
          </div>

          {/* Grid of Repositories */}
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {filteredRepos.map(repo => (
              <article key={repo.id} class="glass-card rounded-2xl p-6 flex flex-col justify-between transition-all duration-300">
                <div>
                  <div class="flex justify-between items-start gap-2 mb-3">
                    <h3 class="font-bold text-lg text-white group-hover:text-indigo-400 transition-colors truncate">
                      {repo.name}
                    </h3>
                    <a href={repo.html_url} target="_blank" class="text-gray-400 hover:text-white text-sm">
                      <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                  </div>

                  <p class="text-gray-400 text-xs line-clamp-3 mb-4 leading-relaxed min-h-[3rem]">
                    {repo.description || 'Описание проекта пока не добавлено.'}
                  </p>

                  {/* Topics / Badges */}
                  {repo.topics && repo.topics.length > 0 && (
                    <div class="flex flex-wrap gap-1.5 mb-4">
                      {repo.topics.slice(0, 4).map(topic => (
                        <span key={topic} class="bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 px-2 py-0.5 rounded-md text-[10px] font-medium">
                          #{topic}
                        </span>
                      ))}
                    </div>
                  )}
                </div>

                {/* Card Footer */}
                <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-gray-400">
                  <div class="flex items-center gap-3">
                    {repo.language && (
                      <span class="flex items-center gap-1 font-medium text-gray-300">
                        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                        {repo.language}
                      </span>
                    )}
                    <span class="flex items-center gap-1"><i class="fa-regular fa-star text-amber-400"></i> {repo.stargazers_count}</span>
                    <span class="flex items-center gap-1"><i class="fa-solid fa-code-branch text-purple-400"></i> {repo.forks_count}</span>
                  </div>

                  {repo.homepage && (
                    <a href={repo.homepage} target="_blank" class="text-indigo-400 font-semibold hover:underline flex items-center gap-1">
                      Demo <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </a>
                  )}
                </div>
              </article>
            ))}
          </div>

          {filteredRepos.length === 0 && (
            <div class="text-center py-16">
              <p class="text-gray-500 text-sm">Проекты не найдены</p>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
